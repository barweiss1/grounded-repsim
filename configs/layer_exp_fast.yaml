# Fast layer_exp run: fewer seeds and layers for quick iteration
# Leave run_id unset to auto-generate a unique results directory
# (avoids overwriting AUC sweep files across runs).
run_id: "fast_last_layers_run"
results_base: "results"

experiments:
  feather:
    enabled: false

  layer_exp:
    enabled: true
    run_stages: ["compute_dists", "compute_full_df", "script"]

    compute_dists:
      dataset: "mnli_matched_100"
      architecture: "base"
      step: 2000000
      num_layers: 12               # Fast: only first 4 layers
      layers: [8, 9, 10, 11]     # Fast: use last 4 layers instead of first 4
      num_seeds: 3               # Fast: only 3 seeds instead of 10
      write_every: 25
      overwrite_dists: false
      embedding_cache_size: 2
      torch_num_threads_per_worker: 1
      metrics: ["softmax_rwka", "softmax_rwka_auc", "rbf_rwka", "rbf_rwka_auc", "PWCCA", "mean_cca_corr", "mean_sq_cca_corr", "CSA", "CKA", "Procrustes", "cka_rbf", "cka_rbf_auc", "mutual_knn", "mutual_knn_auc", "cknna", "cknna_auc"]
      # sweep and AUC options
      metric_param_sweep_len: 30
      auc_integration_method: "average"   # 'trapezoidal' or 'average'
      auc_logscale: true
      # adaptive rbf sigma uses pairwise distance quantiles (feats_A and feats_B)
      auc_adaptive_rbf_sigma: false
      auc_adaptive_quantiles: [0.01, 0.8]
      # adaptive temperature for softmax_rwka uses quantiles of abs inner-products
      auc_adaptive_temperature: false
      auc_adaptive_temperature_quantiles: [0.01, 0.8]

    compute_full_df:
      scores_path: "scores/layer_exp/scores.pkl"

    script:
      scores_path: "scores/layer_exp/scores.pkl"
      task: "SST-2"
      layers: [10, 11]           # Fast: use last layers
      num_layers: 12
      ref_seeds: [1, 2]          # Fast: only 2 ref seeds
      metrics: ["softmax_rwka", "softmax_rwka_auc", "rbf_rwka", "rbf_rwka_auc", "PWCCA", "CKA", "Procrustes", "cka_rbf_auc", "mutual_knn_auc"]
      # same sweep options available to script-level AUC computations
      metric_param_sweep_len: 30
      auc_logscale: true
      auc_adaptive_temperature: false
      auc_adaptive_temperature_quantiles: [0.01, 0.8]

  pca_deletion:
    enabled: false

  pretrain_finetune:
    enabled: false
