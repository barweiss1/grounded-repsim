# Fast PCA deletion run: fewer seeds and layers, but same dims_deleted values
# Use this for quick iteration and testing
run_id: "pca_deletion_fast_run"

results_base: "results"

experiments:
  feather:
    enabled: false

  layer_exp:
    enabled: false

  pca_deletion:
    enabled: true

    compute_dists:
      dataset: "mnli_matched_100"
      architecture: "base"
      step: 2000000
      num_layers: 12
      layers: [8, 9, 10, 11]     # Fast: use last 4 layers instead of first 4
      num_seeds: 3               # Fast: only 3 seeds instead of 10
      total_dim: 768
      dims_deleted: [0, 100, 200, 300, 400, 500, 600, 650, 700, 725, 750, 758, 763, 767]  # Same full range
      metrics: ["rbf_rwka", "rbf_rwka_auc", "softmax_rwka", "softmax_rwka_auc", "PWCCA", "mean_cca_corr", "mean_sq_cca_corr", "CSA", "CKA", "Procrustes", "cka_rbf", "cka_rbf_auc", "mutual_knn", "mutual_knn_auc", "cknna", "cknna_auc"]
      # metrics: ["CKA", "softmax_rwka", "softmax_rwka_auc", "cka_rbf", "cka_rbf_auc", "mutual_knn", "mutual_knn_auc"]
      # sweep and AUC options
      metric_param_sweep_len: 30
      auc_integration_method: "average"
      auc_logscale: true
      auc_adaptive_rbf_sigma: false
      auc_adaptive_quantiles: [0.01, 0.8]
      auc_adaptive_temperature: false
      auc_adaptive_temperature_quantiles: [0.001, 0.5]

    compute_full_df:
      scores_path: "scores/pca_deletion/scores.pkl"
      task: "SST-2"
      ref_seeds: [1, 2]          # Fast: only 2 ref seeds
      layers: [10, 11]           # Fast: use last layers

    script:
      scores_path: "scores/pca_deletion/scores.pkl"
      task: "SST-2"
      ref_seeds: [1, 2]          # Fast: only 2 ref seeds
      layers: [10, 11]           # Fast: use last layers
      num_layers: 12
      metrics: ["rbf_rwka", "rbf_rwka_auc", "softmax_rwka", "softmax_rwka_auc", "PWCCA", "CKA", "Procrustes", "cka_rbf_auc", "mutual_knn_auc"]
      metric_param_sweep_len: 30
      auc_logscale: true
      auc_adaptive_temperature: false
      auc_adaptive_temperature_quantiles: [0.001, 0.5]

  pretrain_finetune:
    enabled: false
